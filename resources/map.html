<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>MiniGo Map</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/openlayers/openlayers.github.io@master/en/v5.3.0/css/ol.css">
    <script src="https://cdn.jsdelivr.net/gh/openlayers/openlayers.github.io@master/en/v5.3.0/build/ol.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #ffffff;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .ol-attribution {
            display: none !important;
        }
    </style>
</head>

<body>

<div id="map"></div>

<script>

    window.mapReady = false;

    const baseLayer = new ol.layer.Tile({
        source: new ol.source.XYZ({
            url: "https://basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png",
            crossOrigin: "anonymous"
        })
    });

    window.map = new ol.Map({
        target: "map",
        layers: [baseLayer],
        controls: ol.control.defaults({ zoom: false }),
        view: new ol.View({
            center: ol.proj.fromLonLat([31.25, 30.05]),
            zoom: 12
        })
    });

    window.routeLayer = null;
    window.markerLayer = null;

    const greenIcon = new ol.style.Icon({
        src: "https://maps.gstatic.com/mapfiles/ms2/micons/green-dot.png",
        scale: 1
    });

    const redIcon = new ol.style.Icon({
        src: "https://maps.gstatic.com/mapfiles/ms2/micons/red-dot.png",
        scale: 1
    });

    window.drawRoute = function(lat1, lng1, lat2, lng2) {

        if (window.routeLayer) map.removeLayer(window.routeLayer);
        if (window.markerLayer) map.removeLayer(window.markerLayer);

        const start = new ol.Feature({
            geometry: new ol.geom.Point(ol.proj.fromLonLat([lng1, lat1]))
        });
        start.setStyle(new ol.style.Style({ image: greenIcon }));

        const end = new ol.Feature({
            geometry: new ol.geom.Point(ol.proj.fromLonLat([lng2, lat2]))
        });
        end.setStyle(new ol.style.Style({ image: redIcon }));

        window.markerLayer = new ol.layer.Vector({
            source: new ol.source.Vector({ features: [start, end] })
        });
        map.addLayer(window.markerLayer);

        const url =
            `https://router.project-osrm.org/route/v1/driving/${lng1},${lat1};${lng2},${lat2}?overview=full&geometries=geojson`;

        fetch(url)
            .then(r => r.json())
            .then(json => {

                if (!json.routes || json.routes.length === 0) return;

                const coords = json.routes[0].geometry.coordinates;
                const olCoords = coords.map(c =>
                    ol.proj.fromLonLat([c[0], c[1]])
                );

                window.routeLayer = new ol.layer.Vector({
                    source: new ol.source.Vector({
                        features: [
                            new ol.Feature({
                                geometry: new ol.geom.LineString(olCoords)
                            })
                        ]
                    }),
                    style: new ol.style.Style({
                        stroke: new ol.style.Stroke({
                            color: "#007bff",
                            width: 5
                        })
                    })
                });

                map.addLayer(window.routeLayer);

                map.getView().fit(window.routeLayer.getSource().getExtent(), {
                    padding: [80, 80, 80, 80],
                    duration: 500
                });

            });
    };

    window.clearRoute = function() {
        if (window.routeLayer) map.removeLayer(window.routeLayer);
        if (window.markerLayer) map.removeLayer(window.markerLayer);
        window.routeLayer = null;
        window.markerLayer = null;
    };

    window.mapReady = true;

</script>

</body>
</html>
